name: pana_driver
description: "Pana Taxista — app para conductores"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^15.1.2

  # ── Networking ───────────────────────────────────────────────────────────────
  dio: ^5.8.0+1
  crypto: ^3.0.6
  socket_io_client: ^3.0.2

  # ── Serialization ────────────────────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── Secure storage ───────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Biometría ────────────────────────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Local cache ──────────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0

  # ── Maps / Location / Permissions ────────────────────────────────────────────
  maplibre_gl: ^0.21.0
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  image_picker: ^1.1.2

  # ── Cámara (selfies de verificación de seguridad durante el viaje) ──────────
  camera: ^0.11.1

  # ── Navegación GUÍADA de Google ─────────────────────────────────────────────
  google_navigation_flutter: ^0.10.0

  # ── Utils ────────────────────────────────────────────────────────────────────
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.10

  # ── Audio ────────────────────────────────────────────────────────────────────
  audioplayers: ^6.1.0

  # ── Notificaciones locales (foreground FCM) ───────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── UI helpers ───────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  intl: ^0.20.2
  google_fonts: ^6.2.1

  # ── Push notifications (Firebase) ────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # ── Code generation ──────────────────────────────────────────────────────────
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/env/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.webp"
  min_sdk_android: 21