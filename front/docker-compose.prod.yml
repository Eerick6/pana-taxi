services:
  front:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: taxi-front
    ports:
      - "3001:3000"
    env_file:
      - ./.env.local
    environment:
      - NODE_ENV=production
    networks:
      - taxi-net

networks:
  taxi-net:
    external: true
    name: back_taxi-net
