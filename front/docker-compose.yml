services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: taxi-front
    ports:
      - "3001:3000"
    env_file:
      - ./.env
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./tsconfig.json:/app/tsconfig.json
      - ./next.config.ts:/app/next.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./jsvectormap.d.ts:/app/jsvectormap.d.ts
    networks:
      - taxi-net

networks:
  taxi-net:
    external: true
    name: back_taxi-net
