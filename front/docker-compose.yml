services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3002
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
    container_name: taxi-front
    ports:
      - "3001:3000"
    env_file:
      - ./.env.local
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - taxi-net

networks:
  taxi-net:
    external: true
    name: back_taxi-net
