services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxi-api
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taxi-net

  db:
    image: mysql:8.4
    container_name: taxi-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taxi}
      MYSQL_USER: ${MYSQL_USER:-taxi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taxi}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-net

  redis:
    image: redis:7-alpine
    container_name: taxi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-net

volumes:
  mysql_data:
  redis_data:

networks:
  taxi-net:
